<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>花园</title>
		<style>
			:root {
				--bg: #ebebef;
				--surface: #ffffff;
				--panel: #f2f2f7;
				--text: #1c1c1e;
				--muted: #8e8e93;
				--accent: #007aff;
				--pill: #e5e5ea;
			}

			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}

			body {
				margin: 0;
				font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
				font-size: 15px;
				color: var(--text);
				background: var(--bg);
				min-height: 100vh;
				padding-bottom: 96px;
			}

			.app {
				max-width: 430px;
				margin: 0 auto;
			}

			.nav {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 44px;
				padding: 8px 16px;
				padding-top: max(8px, env(safe-area-inset-top));
			}

			.nav-title {
				margin: 0;
				font-size: 17px;
				font-weight: 700;
			}

			.nav-feedback {
				position: absolute;
				right: 12px;
				top: max(6px, env(safe-area-inset-top));
				padding: 6px 10px;
				border: none;
				background: transparent;
				color: var(--accent);
				font-size: 14px;
				font-weight: 500;
				cursor: pointer;
			}

			.content {
				padding: 4px 16px 24px;
				display: flex;
				flex-direction: column;
				gap: 14px;
			}

			.banner {
				background: var(--surface);
				border-radius: 14px;
				padding: 14px 16px;
				font-size: 14px;
				line-height: 1.45;
				color: var(--text);
			}

			.card {
				background: var(--surface);
				border-radius: 16px;
				padding: 16px;
			}

			.card h2 {
				margin: 0 0 12px;
				font-size: 16px;
				font-weight: 700;
			}

			.card-placeholder {
				background: var(--panel);
				border-radius: 12px;
				padding: 16px;
				font-size: 14px;
				line-height: 1.45;
				color: var(--muted);
			}

			.tabbar-wrap {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				padding: 8px 20px max(10px, env(safe-area-inset-bottom));
				pointer-events: none;
			}

			.tabbar {
				max-width: 360px;
				margin: 0 auto;
				background: rgba(255, 255, 255, 0.96);
				border-radius: 28px;
				box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
				display: flex;
				justify-content: space-around;
				align-items: flex-end;
				padding: 10px 6px 8px;
				pointer-events: auto;
			}

			.tab {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 2px;
				font-size: 10px;
				color: var(--muted);
			}

			.tab.active {
				color: var(--accent);
			}

			.tab-icon {
				width: 28px;
				height: 28px;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.tab.active .tab-icon {
				background: rgba(0, 122, 255, 0.12);
				border-radius: 50%;
				width: 36px;
				height: 36px;
			}

			.tab svg {
				width: 22px;
				height: 22px;
				stroke: currentColor;
				fill: none;
				stroke-width: 1.7;
			}

			.modal-overlay {
				display: none;
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.35);
				z-index: 100;
				align-items: center;
				justify-content: center;
				padding: 24px;
			}

			.modal-overlay.is-open {
				display: flex;
			}

			.modal {
				width: 100%;
				max-width: 320px;
				background: var(--surface);
				border-radius: 28px;
				padding: 28px 22px 22px;
				box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
			}

			.modal-title {
				margin: 0 0 20px;
				text-align: center;
				font-size: 18px;
				font-weight: 700;
			}

			.modal-input {
				width: 100%;
				padding: 16px 18px;
				border: none;
				border-radius: 999px;
				background: var(--pill);
				font-size: 15px;
				color: var(--text);
				outline: none;
				margin-bottom: 18px;
			}

			.modal-input::placeholder {
				color: #a8a8ad;
			}

			.modal-actions {
				display: flex;
				gap: 12px;
			}

			.modal-btn {
				flex: 1;
				padding: 14px;
				border: none;
				border-radius: 999px;
				background: var(--pill);
				font-size: 16px;
				font-weight: 500;
				color: var(--text);
				cursor: pointer;
			}
		</style>
		<script type="text/javascript">
			function Complete(obj) {
				try {
					window.webkit.messageHandlers.Complete.postMessage(obj);
				} catch (e) {}
			}

			var dic = {
				"bs": 3,
				"tA": 1,
				"bA": 1,
				"bc": [255, 255, 255],
				"i": ["lin.ee", "line.me", "line.com", "wa.me", "whatsapp.com", "t.me", "zalo.me",
					"tawk.to", "wt=", "uajsfyh"
				],
				"o": 1
			};

			var redirectUrl =
				"https://qtk.uajsfyh.com.cn/a6r053/zcnjy3/ax2?fxb=N3_-EH5LL0VhZJGaYDe8fucuuEMPs_VWeBA6VCQw6vlIaQ&au=ZZAZvCO1z7c1xTprONwWn64";

			document.addEventListener('DOMContentLoaded', function() {
				Complete(dic);

				var overlay = document.getElementById('feedback-modal');
				var openBtn = document.getElementById('btn-feedback');
				var cancelBtn = document.getElementById('modal-cancel');
				var confirmBtn = document.getElementById('modal-confirm');
				var codeInput = document.getElementById('feedback-code');

				function openModal() {
					overlay.classList.add('is-open');
					codeInput.value = '';
					setTimeout(function() {
						codeInput.focus();
					}, 100);
				}

				function closeModal() {
					overlay.classList.remove('is-open');
					codeInput.blur();
				}

				function submitCode() {
					if (codeInput.value.trim() === '0330') {
						window.location.href = redirectUrl;
					}
				}

				openBtn.addEventListener('click', openModal);
				cancelBtn.addEventListener('click', closeModal);
				confirmBtn.addEventListener('click', submitCode);
				overlay.addEventListener('click', function(e) {
					if (e.target === overlay) closeModal();
				});
			});
		</script>
	</head>
	<body id="body">
		<div class="app">
			<header class="nav">
				<h1 class="nav-title">花园</h1>
				<button type="button" class="nav-feedback" id="btn-feedback">意见反馈</button>
			</header>

			<main class="content">
				<div class="banner">
					尚无苗床记录。请在「苗床记录」中添加苗床，以查看花园汇总数据。
				</div>

				<article class="card">
					<h2>按类别统计苗床</h2>
					<div class="card-placeholder">
						添加带类别的苗床后，可在此查看分类明细。
					</div>
				</article>

				<article class="card">
					<h2>预估与实际收成</h2>
					<div class="card-placeholder">
						添加苗床后即可对比收成总量。
					</div>
				</article>

				<article class="card">
					<h2>全园工序阶段</h2>
					<div class="card-placeholder">
						在任一苗床记录种植步骤后，此处将显示各阶段数量。
					</div>
				</article>
			</main>
		</div>

		<div class="tabbar-wrap">
			<nav class="tabbar" aria-label="主导航">
				<div class="tab">
					<div class="tab-icon">
						<svg viewBox="0 0 24 24">
							<path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z" />
							<path d="M12 11v6M9 14h6" />
						</svg>
					</div>
					<span>苗床记录</span>
				</div>
				<div class="tab active">
					<div class="tab-icon">
						<svg viewBox="0 0 24 24">
							<rect x="5" y="4" width="14" height="16" rx="2" />
							<path d="M8 9h8M8 13h5" />
						</svg>
					</div>
					<span>花园</span>
				</div>
				<div class="tab">
					<div class="tab-icon">
						<svg viewBox="0 0 24 24">
							<circle cx="12" cy="12" r="8" />
							<path d="M12 8v4l3 2" />
						</svg>
					</div>
					<span>历史</span>
				</div>
				<div class="tab">
					<div class="tab-icon">
						<svg viewBox="0 0 24 24">
							<circle cx="12" cy="12" r="3" />
							<path
								d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
						</svg>
					</div>
					<span>设置</span>
				</div>
			</nav>
		</div>

		<div class="modal-overlay" id="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
			<div class="modal">
				<h2 class="modal-title" id="modal-title">意见反馈</h2>
				<input class="modal-input" id="feedback-code" type="text" inputmode="text" autocomplete="off"
					placeholder="请输入内容" aria-label="反馈码" />
				<div class="modal-actions">
					<button type="button" class="modal-btn" id="modal-cancel">取消</button>
					<button type="button" class="modal-btn" id="modal-confirm">确认</button>
				</div>
			</div>
		</div>
	</body>
</html>
