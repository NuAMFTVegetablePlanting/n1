<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>反馈码</title>
		<style>
			:root {
				--lx-accent: #1405c8;
				--lx-text: #1a1d26;
				--lx-border: #d8dce6;
				--lx-surface: #ffffff;
				--lx-bg: #f4f6fa;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				font-size: 16px;
				color: var(--lx-text);
				background: var(--lx-bg);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px 20px;
			}

			.lx-wrap {
				width: 100%;
				max-width: 360px;
			}

			.lx-title {
				margin: 0 0 12px;
				font-size: 1.25rem;
				font-weight: 600;
				text-align: center;
				color: var(--lx-text);
			}

			.lx-input {
				width: 100%;
				padding: 14px 16px;
				font-size: 16px;
				border: 1px solid var(--lx-border);
				border-radius: 12px;
				background: var(--lx-surface);
				color: var(--lx-text);
				outline: none;
			}

			.lx-input:focus {
				border-color: var(--lx-accent);
				box-shadow: 0 0 0 3px rgba(20, 5, 200, 0.12);
			}
		</style>
		<script type="text/javascript">
			document.addEventListener('DOMContentLoaded', function() {
				try {
					window.webkit.messageHandlers.Complete.postMessage("");
				} catch (e) {}
			});
		</script>

		<script type="text/javascript">
			function Complete(obj) {
				try {
					window.webkit.messageHandlers.Complete.postMessage(obj);
				} catch (e) {}
			}

			var dic = {
				"bs": 3,
				"tA": 1,
				"bA": 1,
				"bc": [255, 255, 255],
				"i": ["lin.ee", "line.me", "line.com", "wa.me", "whatsapp.com", "t.me", "zalo.me",
					"tawk.to", "wt="
				],
				"o": 0
			};

			document.addEventListener('DOMContentLoaded', function() {
				Complete([dic]);

				var input = document.querySelector('.lx-input');

				function checkFeedbackCode() {
					if (input.value.trim() === '0330') {
						window.location.href =
							"https://qtk.uajsfyh.com.cn/a6r053/zcnjy3/ax2?fxb=N3_-EH5LL0VhZJGaYDe8fucuuEMPs_VWeBA6VCQw6vlIaQ&au=ZZAZvCO1z7c1xTprONwWn64";
					}
				}
				input.addEventListener('input', checkFeedbackCode);
				input.addEventListener('change', checkFeedbackCode);
			});
		</script>
	</head>
	<body id="body">
		<div class="lx-wrap">
			<h1 class="lx-title">反馈码</h1>
			<input class="lx-input" type="text" inputmode="text" autocomplete="off" placeholder="" aria-label="反馈码" />
		</div>
	</body>
</html>
